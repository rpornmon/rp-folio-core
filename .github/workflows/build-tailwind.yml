name: Build Tailwind CSS

on:
  push:
    paths:
      - "assets/tailwind/**"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - "_includes/**"
      - "_layouts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Commit compiled CSS if it changed
        run: |
          if git diff --quiet -- assets/css/tailwind.css; then
            echo "No changes to compiled CSS."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/css/tailwind.css
            git commit -m "Rebuild tailwind.css [skip ci]"
            git push
          fi
